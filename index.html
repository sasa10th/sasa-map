<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교내 실내 지도</title>
<style>
:root{--bg:#fff;--ink:#202124;--sub:#5f6368;--line:#dadce0;--acc:#1a6fe0;--fac:#0b6e69;--sel:#d9361f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202225;--ink:#e8eaed;--sub:#9aa0a6;--line:#3c4043}}
:root[data-theme="dark"]{--bg:#202225;--ink:#e8eaed;--sub:#9aa0a6;--line:#3c4043}
html,body{height:100%;margin:0}
body{color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.on{border-color:var(--acc);color:var(--acc)}button:disabled{opacity:.45}
#app{height:100%;display:flex;flex-direction:column}
header{padding:8px 10px;border-bottom:1px solid var(--line);position:relative;z-index:5}
.t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.t b{font-size:14px}.t span{font-size:12px;color:var(--sub)}
#q{width:100%;box-sizing:border-box;height:38px;border:1px solid var(--line);border-radius:3px;padding:0 10px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
#res{position:absolute;left:10px;right:10px;top:calc(100% - 4px);background:var(--bg);border:1px solid var(--line);max-height:42vh;overflow:auto;box-shadow:0 2px 6px rgba(0,0,0,.18)}
#res button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:40px;align-items:center;text-align:left}
#res span+span,.nr{color:var(--sub);font-size:12px}.nr{padding:10px}
#map{position:relative;flex:1;min-height:0;background:#eceeef;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#sv{position:absolute;inset:0;width:100%;height:100%;display:block}
.floor{display:none}.floor.on{display:inline}
.floor *{pointer-events:none}.floor [data-p]{pointer-events:all}
.floor .sel{fill:#1a6fe0;fill-opacity:.2;stroke:#1a6fe0;stroke-width:1.4}
.lb{font:600 9px system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#3c4043;paint-order:stroke;stroke:#fff;stroke-width:2.6px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lb.f{fill:var(--fac)}
.acc{fill:#1a6fe0;fill-opacity:.12;stroke:#1a6fe0;stroke-opacity:.4;stroke-width:1}
.fov{fill:#1a6fe0;fill-opacity:.2}.dot{fill:#1a6fe0;stroke:#fff;stroke-width:3}
.arw{fill:#1a6fe0;stroke:#fff;stroke-width:1.2;stroke-linejoin:round}.pin{fill:var(--sel);stroke:#fff;stroke-width:2}
#lbl,#accC,#pin,#me{pointer-events:none}
.ctl{position:absolute;display:flex;flex-direction:column}
#rc{right:8px;bottom:10px;gap:6px}#fc{left:8px;top:10px}
#rc button{width:50px;min-height:40px;padding:0;font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
#rc button:nth-child(-n+2){font-size:20px}
#fc button{width:46px;min-height:40px;padding:0;font-size:12px;border-radius:0;margin-top:-1px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
#fc button:first-child{border-radius:3px 3px 0 0;margin:0}#fc button:last-child{border-radius:0 0 3px 3px}
#fc button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#fc button[data-me]::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:3px;vertical-align:middle}
#fc button.on[data-me]::after{background:#fff}
#hint{position:absolute;left:62px;right:8px;top:10px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--acc);border-radius:3px;padding:6px 8px;font-size:13px}
#hint button{margin-left:auto;min-height:28px;font-size:12px;flex:none}
[hidden]{display:none!important}
#panel{border-top:1px solid var(--line);padding:8px 10px;position:relative;z-index:5}
#pn{font-weight:600;font-size:15px}#pd{font-size:13px;color:var(--sub)}
#acts{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
#acts button{white-space:nowrap;min-height:34px;font-size:13px;flex:none}
#stat,#note{font-size:12px;color:var(--sub);margin-top:6px}
</style></head><body>

 if(Ori.on){removeEventListener('deviceorientationabsolute',onOri,true);removeEventListener('deviceorientation',onOri,true);Ori.on=false;Ori.ok=false;Ori.err='';return}

 if(!('DeviceOrientationEvent' in window)){Ori.deny='이 브라우저는 방향 센서를 지원하지 않는다';return}
 try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted'){Ori.deny='방향 센서 권한이 거부되었다(설정에서 허용 후 다시 시도)';return}}
 catch(e){Ori.deny='방향 센서 권한 요청에 실패했다(HTTPS 필요)';return}
 addEventListener('deviceorientationabsolute',onOri,true);addEventListener('deviceorientation',onOri,true);
 Ori.on=true;Ori.ok=false;Ori.t0=performance.now()}
function setDir(m){if(!me.on||(me.f&&me.f!==V.fl))return note('먼저 이 층에서 내 위치를 지정하라.');
 const a=(Math.atan2(m.x-me.x,-(m.y-me.y))*180/Math.PI+360)%360;
 if(Ori.on&&Ori.ok){off=(a-Ori.t+360)%360;ls.s('off',off);man=null;note('북쪽 보정값을 '+Math.round(off)+'°로 설정했다.')}
 else{man=a;note('방향을 수동으로 지정했다. 센서가 없으면 몸을 돌려도 갱신되지 않는다.')}}
function status(){
 const a=me.on?'위치: '+me.src+(me.f?' ('+me.f+'층)':' (층 구분 없음)'):'위치: 미지정';
 const b=Ori.on?(Ori.ok?'방향: 센서 '+Math.round(Ori.t)+'° / 보정 '+Math.round(off)+'°':'방향: '+(Ori.err||'센서 대기 중')):Ori.deny?'방향: '+Ori.deny:man!=null?'방향: 수동 지정(고정)':'방향: 꺼짐';
 $('#stat').textContent=a+' · '+b;$('#a-sens').textContent=Ori.on?'방향 센서 끄기':'방향 센서 켜기';$('#a-sens').classList.toggle('on',Ori.on&&Ori.ok);$('#a-dir').disabled=!me.on}
setInterval(()=>{const n=performance.now();
 if(Ori.on&&Ori.ok&&n-Ori.at>2500){Ori.ok=false;Ori.err='센서 값 수신이 끊겼다'}
 if(Ori.on&&!Ori.ok&&!Ori.err&&n-Ori.t0>2500)Ori.err='센서 값을 받지 못했다(미지원 또는 비활성)';status()},400);

/* ---- 입력: 드래그, 핀치, 휠, 탭 ---- */
const Pt=new Map();let multi=false;
mapEl.addEventListener('pointerdown',e=>{if(e.target.closest('.ctl,#hint'))return;anim=null;mapEl.setPointerCapture(e.pointerId);
 Pt.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now(),mv:false});if(Pt.size>1)multi=true;$('#res').hidden=true;$('#q').blur()});
mapEl.addEventListener('pointermove',e=>{const p=Pt.get(e.pointerId);if(!p)return;
 if(Math.hypot(e.clientX-p.x0,e.clientY-p.y0)>8)p.mv=true;
 if(Pt.size===1){if(p.mv){V.tx+=e.clientX-p.x;V.ty+=e.clientY-p.y;dirty=1}}
 else if(Pt.size===2){const[a,b]=[...Pt.values()],o=p===a?b:a,r=mapEl.getBoundingClientRect();
  const c0={x:(p.x+o.x)/2,y:(p.y+o.y)/2},c1={x:(e.clientX+o.x)/2,y:(e.clientY+o.y)/2},d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
  V.tx+=c1.x-c0.x;V.ty+=c1.y-c0.y;if(d0>0)zoomAt(c1.x-r.left,c1.y-r.top,d1/d0);dirty=1}
 p.x=e.clientX;p.y=e.clientY});
const up=e=>{const p=Pt.get(e.pointerId);if(!p)return;Pt.delete(e.pointerId);
 if(e.type==='pointerup'&&!p.mv&&!multi&&performance.now()-p.t<600)tap(e.clientX,e.clientY);if(!Pt.size)multi=false};
mapEl.addEventListener('pointerup',up);mapEl.addEventListener('pointercancel',up);
mapEl.addEventListener('wheel',e=>{e.preventDefault();anim=null;const r=mapEl.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)))},{passive:false});
function tap(x,y){const m=toMap(x,y);
 if(mode==='pos'){setPos(V.fl,m.x,m.y,'수동 지정');setMode(null);note('위치를 지정했다. 이동하면 다시 지정하라.');return}
 if(mode==='dir'){setDir(m);setMode(null);return}
 const el=document.elementFromPoint(x,y)?.closest?.('[data-p]');
 if(el){const[f,id]=el.dataset.p.split(':');select(byId.get(f+':'+id)||null)}else select(null)}

/* ---- 검색 ---- */
const q=$('#q'),res=$('#res');
const found=()=>{const s=q.value.trim().toLowerCase().replace(/호$/,'');if(!s)return[];
 return PL.filter(p=>p.s.includes(s)).sort((a,b)=>(b.key.toLowerCase().startsWith(s)-a.key.toLowerCase().startsWith(s))||a.f-b.f).slice(0,12)};
const pick=p=>{select(p,true);q.value=p.name;res.hidden=true;q.blur()};
q.addEventListener('input',()=>{const m=found();
 res.replaceChildren(...(m.length?m.map(p=>{const b=document.createElement('button');b.type='button';const a=document.createElement('span'),c=document.createElement('span');a.textContent=p.name;c.textContent=p.f+'층';b.append(a,c);b.onclick=()=>pick(p);return b}):[Object.assign(document.createElement('div'),{className:'nr',textContent:'검색 결과가 없다'})]));
 res.hidden=!q.value.trim()});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const m=found();if(m[0])pick(m[0])}});

/* ---- 버튼 ---- */
$('#zi').onclick=()=>fly((W/2-V.tx)/V.k,(H/2-V.ty)/V.k,V.k*1.6,200);
$('#zo').onclick=()=>fly((W/2-V.tx)/V.k,(H/2-V.ty)/V.k,V.k/1.6,200);
$('#rst').onclick=reset;
$('#tog').onclick=()=>{V.show=!V.show;$('#tog').classList.toggle('on',V.show);dirty=1};
$('#loc').onclick=()=>{if(me.on){V.show=true;$('#tog').classList.add('on');if(me.f)setFloor(me.f);fly(me.x,me.y,Math.max(V.k,V.fit*2.2))}
 else{note('내 위치가 지정되지 않았다. 실내에서는 직접 지정해야 한다.');setMode('pos','지도에서 현재 위치를 누르라 ('+V.fl+'층)')}};
$('#a-here').onclick=()=>{if(sel){setPos(sel.f,sel.x,sel.y,'수동 지정(장소 기준)');setFloor(sel.f);note('선택한 장소의 중심을 내 위치로 지정했다.')}};
$('#a-pick').onclick=()=>mode==='pos'?setMode(null):setMode('pos','지도에서 현재 위치를 누르라 ('+V.fl+'층)');
$('#a-dir').onclick=()=>mode==='dir'?setMode(null):setMode('dir','내가 바라보는 쪽의 지점을 누르라');
$('#a-sens').onclick=sensor;
$('#a-clr').onclick=()=>{me.on=false;man=null;setFloor(V.fl);note('내 위치를 해제했다.')};
$('#a-gps').onclick=()=>{if(!navigator.geolocation)return note('이 브라우저는 위치 정보 API를 지원하지 않는다.');if(me.on&&!me.src.startsWith('GPS'))me.on=false;gpsStart();navigator.geolocation.getCurrentPosition(onGps,gerr,{enableHighAccuracy:true,timeout:15000});note('GPS 수신 중');};$('#hc').onclick=()=>setMode(null);

/* ---- 초기화 ---- */
new ResizeObserver(()=>{const w=mapEl.clientWidth,h=mapEl.clientHeight;if(!w||!h)return;const first=!W;
 const cx=first?(B.x0+B.x1)/2:(W/2-V.tx)/V.k,cy=first?(B.y0+B.y1)/2:(H/2-V.ty)/V.k,of=V.fit;
 W=w;H=h;V.fit=Math.min(W/(B.x1-B.x0),H/(B.y1-B.y0))*.96;
 V.k=first?V.fit:clamp(V.k*V.fit/of,V.fit*.8,V.fit*14);V.tx=W/2-cx*V.k;V.ty=H/2-cy*V.k;dirty=1}).observe(mapEl);
setFloor(V.fl);select(null);
note(GEO_ANCHORS.length<3?'교내 GPS 기준점이 설정되지 않아 실내 위치는 자동으로 알 수 없다. 위치는 직접 지정하고, 이동하면 다시 지정해야 한다.':'GPS 위치는 실내에서 크게 어긋날 수 있다. 어긋나면 지도에서 직접 지정하라.');
if(GEO_ANCHORS.length>=3)gpsStart();
requestAnimationFrame(tick);
})();
</script></body></html>
